services:
  - type: web
    name: tiktok-live-tool-server
    env: node
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: EULER_STREAM_API_KEY
        sync: false
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
